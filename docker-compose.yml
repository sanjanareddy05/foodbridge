services:
  db:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@db:5432/foodbridge
      JWT_SECRET: "dev_local_secret_please_change"
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api]

volumes:
  postgres_data:
