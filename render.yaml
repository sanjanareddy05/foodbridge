services:
  - type: web
    name: foodbridge-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace server
    startCommand: npm run start --workspace server
    rootDir: server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: foodbridge-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://YOUR_VERCEL_DOMAIN.vercel.app
      - key: BCRYPT_ROUNDS
        value: 12

databases:
  - name: foodbridge-db
    engine: postgres
    version: 15
    initialSqlPath: ./server/src/db/schema.sql
    plan: free
